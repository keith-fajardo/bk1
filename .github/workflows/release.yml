name: Release

# Publishes a GitHub Release (per-platform bk1 tarballs) when the version in
# package.json advances. Triggered on push to main: the `gate` job reads
# package.json's version and checks whether a `v<version>` tag already exists on
# the remote. If it does, nothing else runs; if not, the build matrix compiles
# the binary per platform, action-gh-release creates the tag + Release at this
# commit, and the homebrew job pushes a refreshed formula to the tap.
#
# So a release is cut by bumping the version (`bun run bump <version>`) and
# pushing to main — NOT by hand-tagging. Ordinary pushes that don't change the
# version no-op at the gate, so the 3-platform matrix never spins up.
#
# Tarball layout: bk1, bk1-lint, kimball/kimball.db at the root. bk1 resolves
# its sidecars sibling-of-binary at runtime (see src/bk1-home.ts).

on:
  push:
    branches: [main]
  workflow_dispatch:   # manual re-run, e.g. to retry a failed release build

permissions:
  contents: write

jobs:
  # Decide whether this push should release: true only when package.json's
  # version has no matching v<tag> on the remote yet. Cheap ubuntu job, so the
  # build matrix is skipped entirely on non-release pushes.
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already released — skipping."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is new — building + releasing."
          fi

  build:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
            bun_target: bun-darwin-arm64
          - runner: macos-13
            platform: darwin-x64
            bun_target: bun-darwin-x64
          - runner: ubuntu-22.04
            platform: linux-x64
            bun_target: bun-linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build bk1-lint
        working-directory: sidecars/lint
        run: cargo build --release --quiet

      - name: Compile bk1 binary
        # --define process.env.DEV='"false"': inlines DEV as the literal string
        # "false" so bun dead-code-eliminates the guarded `if (process.env.DEV
        # === 'true')` block in Ink's reconciler. That block dynamic-imports
        # ./devtools.js, which statically imports react-devtools-core — an
        # optional peer dep we don't ship. Without the DCE, bun either fails
        # at compile (can't resolve the package) or emits a runtime require
        # that crashes the binary on launch.
        run: bun build --compile --target=${{ matrix.bun_target }} --define process.env.DEV='"false"' --outfile bk1 src/app.tsx

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          VERSION="${{ needs.gate.outputs.version }}"
          STAGE="bk1-${VERSION}-${{ matrix.platform }}"
          mkdir -p "$STAGE/kimball"
          cp bk1 "$STAGE/bk1"
          cp sidecars/lint/target/release/bk1-lint "$STAGE/bk1-lint"
          cp skills_data/kimball/kimball.db "$STAGE/kimball/kimball.db"
          chmod +x "$STAGE/bk1" "$STAGE/bk1-lint"
          tar -czf "${STAGE}.tar.gz" -C "$STAGE" .
          shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Upload to release
        # tag_name + target_commitish create the v<version> tag at this commit
        # the first time a matrix leg uploads; later legs append their tarballs
        # to the same Release. The tag is created HERE (not in the gate) so a
        # failed build never leaves an orphan tag that blocks a later re-release.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.STAGE }}.tar.gz
            ${{ env.STAGE }}.tar.gz.sha256
          generate_release_notes: true

  # Renders dist/homebrew/bk1.rb.tmpl with this release's version + per-platform
  # sha256 and pushes it to the tap repo so `brew install keith-fajardo/tap/bk1`
  # serves the new version. Requires a HOMEBREW_TAP_TOKEN secret: a PAT (or
  # fine-grained token) with contents:write on keith-fajardo/homebrew-tap and
  # read access to this repo's releases. Skipped automatically if the secret
  # isn't set, so releases still succeed before the tap is wired up.
  homebrew:
    needs: [gate, build]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render formula and push to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping tap update."
            exit 0
          fi
          VERSION="${{ needs.gate.outputs.version }}"

          # Pull the checksums published by the build job above. The .sha256
          # files are "<hash>  <filename>" — keep just the hash.
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --dir sums
          SHA_DARWIN_ARM64="$(awk '{print $1}' "sums/bk1-${VERSION}-darwin-arm64.tar.gz.sha256")"
          SHA_DARWIN_X64="$(awk '{print $1}' "sums/bk1-${VERSION}-darwin-x64.tar.gz.sha256")"
          SHA_LINUX_X64="$(awk '{print $1}' "sums/bk1-${VERSION}-linux-x64.tar.gz.sha256")"

          sed -e "s/@@VERSION@@/${VERSION}/g" \
              -e "s/@@SHA_DARWIN_ARM64@@/${SHA_DARWIN_ARM64}/g" \
              -e "s/@@SHA_DARWIN_X64@@/${SHA_DARWIN_X64}/g" \
              -e "s/@@SHA_LINUX_X64@@/${SHA_LINUX_X64}/g" \
              dist/homebrew/bk1.rb.tmpl > bk1.rb

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp bk1.rb tap/Formula/bk1.rb
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/bk1.rb
          # --cached so this also fires when the formula is brand new (untracked
          # files don't show in a plain `git diff`).
          if git diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git commit -m "bk1 ${VERSION}"
          git push
