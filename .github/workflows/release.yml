name: Release

# Publishes a GitHub Release (per-platform bk1 tarballs) when the version in
# package.json advances. Triggered on push to main: the `gate` job reads
# package.json's version and checks whether a `v<version>` tag already exists on
# the remote. If it does, nothing else runs; if not, the build matrix compiles
# the binary per platform, action-gh-release creates the tag + Release at this
# commit, and the homebrew job pushes a refreshed formula to the tap.
#
# So a release is cut by bumping the version (`bun run bump <version>`) and
# pushing to main — NOT by hand-tagging. Ordinary pushes that don't change the
# version no-op at the gate, so the 3-platform matrix never spins up.
#
# Tarball layout: bk1, bk1-review, bk1-lint, kimball/kimball.db at the root, plus
# bk1-colibri (column-lineage sidecar) on native-arch legs only — PyInstaller can't
# cross-compile, so darwin-x64 ships without it and falls back to the built-in tracer.
# bk1 resolves its sidecars sibling-of-binary at runtime (see src/bk1-home.ts).

on:
  push:
    branches: [main]
  workflow_dispatch:   # manual re-run, e.g. to retry a failed release build

permissions:
  contents: write

jobs:
  # Decide whether this push should release: true only when package.json's
  # version has no matching v<tag> on the remote yet. Cheap ubuntu job, so the
  # build matrix is skipped entirely on non-release pushes.
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already released — skipping."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is new — building + releasing."
          fi

  build:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      # Both macOS arches build on the arm64 runner (macos-14): bun and cargo
      # cross-compile to x86_64 via bun_target / rust_target. This avoids the
      # macos-13 (Intel) runner, whose queue times are long and unpredictable
      # and would otherwise block the whole release (the homebrew job needs all
      # legs). rust_target is passed to cargo for every leg so the artifact path
      # is uniform; for a native leg it's just an explicit host triple.
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
            bun_target: bun-darwin-arm64
            rust_target: aarch64-apple-darwin
          - runner: macos-14
            platform: darwin-x64
            bun_target: bun-darwin-x64
            rust_target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            platform: linux-x64
            bun_target: bun-linux-x64
            rust_target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build bk1-lint
        working-directory: sidecars/lint
        run: cargo build --release --target ${{ matrix.rust_target }} --quiet

      - name: Set up Python (colibri sidecar)
        # PyInstaller produces a host-arch binary and cannot cross-compile, so the colibri
        # sidecar is built only on legs whose runner arch matches the target: darwin-arm64
        # (macos-14 = arm64) and linux-x64 (ubuntu = x64). The cross-compiled darwin-x64 leg
        # skips it and falls back to bk1's built-in tracer (src/colibri.ts resolves gracefully).
        if: matrix.platform != 'darwin-x64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build bk1-colibri
        # continue-on-error: colibri is an OPTIONAL augmentation with a built-in tracer
        # fallback, so a PyInstaller hiccup must never block the core bk1 release. If this
        # fails, the conditional staging step below just omits bk1-colibri from the tarball.
        if: matrix.platform != 'darwin-x64'
        continue-on-error: true
        run: bash sidecars/colibri/build.sh

      - name: Compile bk1 binary
        # --define process.env.DEV='"false"': inlines DEV as the literal string
        # "false" so bun dead-code-eliminates the guarded `if (process.env.DEV
        # === 'true')` block in Ink's reconciler. That block dynamic-imports
        # ./devtools.js, which statically imports react-devtools-core — an
        # optional peer dep we don't ship. Without the DCE, bun either fails
        # at compile (can't resolve the package) or emits a runtime require
        # that crashes the binary on launch.
        run: bun build --compile --target=${{ matrix.bun_target }} --define process.env.DEV='"false"' --outfile bk1 src/app.tsx

      - name: Compile bk1-review binary
        # Headless CI review entry (no Ink). Same --define DCE rationale as bk1 above:
        # harmless here, kept uniform with the TUI build.
        run: bun build --compile --target=${{ matrix.bun_target }} --define process.env.DEV='"false"' --outfile bk1-review src/headless-review.ts

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          VERSION="${{ needs.gate.outputs.version }}"
          STAGE="bk1-${VERSION}-${{ matrix.platform }}"
          mkdir -p "$STAGE/kimball"
          cp bk1 "$STAGE/bk1"
          cp bk1-review "$STAGE/bk1-review"
          cp sidecars/lint/target/${{ matrix.rust_target }}/release/bk1-lint "$STAGE/bk1-lint"
          cp skills_data/kimball/kimball.db "$STAGE/kimball/kimball.db"
          chmod +x "$STAGE/bk1" "$STAGE/bk1-review" "$STAGE/bk1-lint"
          # Optional colibri sidecar — present only on native-arch legs (see build step).
          if [[ -f sidecars/colibri/dist/bk1-colibri ]]; then
            cp sidecars/colibri/dist/bk1-colibri "$STAGE/bk1-colibri"
            cp sidecars/colibri/THIRD_PARTY_NOTICES.txt "$STAGE/bk1-colibri.LICENSE.txt"
            chmod +x "$STAGE/bk1-colibri"
          fi
          tar -czf "${STAGE}.tar.gz" -C "$STAGE" .
          shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Upload build artifact
        # Each leg uploads its tarball + checksum as a workflow artifact — NOT
        # straight to the Release. The single `release` job below collects all
        # three and creates the Release in one atomic action-gh-release call.
        # This fixes the race where parallel legs all called action-gh-release
        # on the same tag and 422'd ("already_exists") on concurrent finalize.
        uses: actions/upload-artifact@v4
        with:
          name: bk1-${{ matrix.platform }}
          path: |
            ${{ env.STAGE }}.tar.gz
            ${{ env.STAGE }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  # Create the GitHub Release ONCE, attaching all three platform tarballs in a
  # single action-gh-release call. Pulling release creation out of the build
  # matrix eliminates the concurrent-finalize race (see the build artifact step).
  # `needs: build` means every leg must succeed first, so the v<version> tag is
  # created only after all builds pass — a failed build leaves no orphan tag,
  # preserving the property the old inline-create was chosen for.
  release:
    needs: [gate, build]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Collect all platform tarballs
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bk1-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true

  # Renders dist/homebrew/bk1.rb.tmpl with this release's version + per-platform
  # sha256 and pushes it to the tap repo so `brew install keith-fajardo/tap/bk1`
  # serves the new version. Requires a HOMEBREW_TAP_TOKEN secret: a PAT (or
  # fine-grained token) with contents:write on keith-fajardo/homebrew-tap and
  # read access to this repo's releases. Skipped automatically if the secret
  # isn't set, so releases still succeed before the tap is wired up.
  homebrew:
    needs: [gate, release]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render formula and push to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping tap update."
            exit 0
          fi
          VERSION="${{ needs.gate.outputs.version }}"

          # Pull the checksums published by the build job above. The .sha256
          # files are "<hash>  <filename>" — keep just the hash.
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --dir sums
          SHA_DARWIN_ARM64="$(awk '{print $1}' "sums/bk1-${VERSION}-darwin-arm64.tar.gz.sha256")"
          SHA_DARWIN_X64="$(awk '{print $1}' "sums/bk1-${VERSION}-darwin-x64.tar.gz.sha256")"
          SHA_LINUX_X64="$(awk '{print $1}' "sums/bk1-${VERSION}-linux-x64.tar.gz.sha256")"

          sed -e "s/@@VERSION@@/${VERSION}/g" \
              -e "s/@@SHA_DARWIN_ARM64@@/${SHA_DARWIN_ARM64}/g" \
              -e "s/@@SHA_DARWIN_X64@@/${SHA_DARWIN_X64}/g" \
              -e "s/@@SHA_LINUX_X64@@/${SHA_LINUX_X64}/g" \
              dist/homebrew/bk1.rb.tmpl > bk1.rb

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp bk1.rb tap/Formula/bk1.rb
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/bk1.rb
          # --cached so this also fires when the formula is brand new (untracked
          # files don't show in a plain `git diff`).
          if git diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git commit -m "bk1 ${VERSION}"
          git push

  # Publishes the VS Code extension to the Marketplace when vscode-ext's version
  # is new. The extension version bumps alongside bk1 via `bun run bump <ver>`,
  # or on its own via `bun run bump ext <ver>`. Requires an AZURE_DEVOPS_PAT
  # secret: a marketplace PAT for publisher `keithfajardo`. Skipped automatically
  # if the secret isn't set, and idempotent — a `vsce show` check no-ops the job
  # when this version is already published, so ordinary pushes don't re-publish.
  #
  # `needs: release` so a co-released bk1 v<BK1_VERSION> exists before the new
  # extension (which downloads that binary on first activation) goes live. The
  # `always()` guard lets it run on extension-only bumps too (build + release are
  # skipped), but the result checks refuse to publish if a co-running bk1 build
  # or the release FAILED (the extension would point at a release that never got
  # created). success-or-skipped on both = "didn't fail", which is what we want.
  extension:
    needs: [gate, build, release]
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish extension to Marketplace
        working-directory: vscode-ext
        env:
          VSCE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${VSCE_PAT:-}" ]]; then
            echo "AZURE_DEVOPS_PAT not set — skipping extension publish."
            exit 0
          fi
          LOCAL="$(jq -r .version package.json)"
          NAME="$(jq -r '.publisher + "." + .name' package.json)"

          # Idempotent: skip when this exact version is already on the Marketplace
          # (so non-bump pushes to main no-op here). `vsce show` needs no auth.
          PUBLISHED="$(npx --yes @vscode/vsce show "$NAME" --json 2>/dev/null || echo '{}')"
          if echo "$PUBLISHED" | jq -e --arg v "$LOCAL" '.versions[]? | select(.version == $v)' >/dev/null 2>&1; then
            echo "$NAME@$LOCAL already published — skipping."
            exit 0
          fi

          npm ci
          npm run build  # tsc -> out/ (vsce has no vscode:prepublish hook here)
          # --no-dependencies: the extension imports only node builtins + the
          # vscode API (host-provided), so there is no node_modules to bundle.
          npx --yes @vscode/vsce publish --no-dependencies -p "$VSCE_PAT"
          echo "Published $NAME@$LOCAL"
